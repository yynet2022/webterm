<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Web Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            overflow: hidden;
        }
        #terminal {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-unicode11@0.8.0/lib/addon-unicode11.min.js"></script>
    <script>
        // ターミナルの表示設定定数
        const DEFAULT_FONT_SIZE = 14;
        const ACTIVE_THEME_NAME = "__THEME__";
        const FONT_FAMILY = "\"UDEV Gothic\", \"BIZ UDGothic\", \"Noto Sans Mono CJK JP\", monospace";
        const UNICODE_VERSION = "11";
        const EXIT_MESSAGE = "\r\n\x1b[33m[Process exited / Connection closed]\x1b[0m\r\n";

        // プリセットカラーテーマ定義（ANSI 16色 + 基本色）
        const THEMES = {
            "dark": {
                background: "#1e1e1e",
                foreground: "#cccccc",
                cursor: "#ffffff",
                cursorAccent: "#1e1e1e",
                selectionBackground: "rgba(255, 255, 255, 0.3)",
                black: "#000000",
                red: "#cd3131",
                green: "#0dbc79",
                yellow: "#e5e510",
                blue: "#2472c8",
                magenta: "#bc3fbc",
                cyan: "#11a8cd",
                white: "#e5e5e5",
                brightBlack: "#666666",
                brightRed: "#f14c4c",
                brightGreen: "#23d18b",
                brightYellow: "#f5f543",
                brightBlue: "#3b8eea",
                brightMagenta: "#d670d6",
                brightCyan: "#29b8db",
                brightWhite: "#ffffff"
            },
            "light": {
                background: "#ffffff",
                foreground: "#333333",
                cursor: "#333333",
                cursorAccent: "#ffffff",
                selectionBackground: "rgba(0, 0, 0, 0.2)",
                black: "#000000",
                red: "#cd3131",
                green: "#00bc00",
                yellow: "#949800",
                blue: "#0451a5",
                magenta: "#bc05bc",
                cyan: "#0598bc",
                white: "#555555",
                brightBlack: "#666666",
                brightRed: "#cd3131",
                brightGreen: "#14ce14",
                brightYellow: "#b5ba00",
                brightBlue: "#0451a5",
                brightMagenta: "#bc05bc",
                brightCyan: "#0598bc",
                brightWhite: "#a5a5a5"
            },
            "dracula": {
                background: "#282a36",
                foreground: "#f8f8f2",
                cursor: "#f8f8f2",
                cursorAccent: "#282a36",
                selectionBackground: "rgba(68, 71, 90, 0.7)",
                black: "#21222c",
                red: "#ff5555",
                green: "#50fa7b",
                yellow: "#f1fa8c",
                blue: "#bd93f9",
                magenta: "#ff79c6",
                cyan: "#8be9fd",
                white: "#f8f8f2",
                brightBlack: "#6272a4",
                brightRed: "#ff6e6e",
                brightGreen: "#69ff94",
                brightYellow: "#ffffa5",
                brightBlue: "#d6acff",
                brightMagenta: "#ff92df",
                brightCyan: "#a4ffff",
                brightWhite: "#ffffff"
            },
            "solarized-dark": {
                background: "#002b36",
                foreground: "#839496",
                cursor: "#93a1a1",
                cursorAccent: "#002b36",
                selectionBackground: "rgba(7, 54, 66, 0.8)",
                black: "#073642",
                red: "#dc322f",
                green: "#859900",
                yellow: "#b58900",
                blue: "#268bd2",
                magenta: "#d33682",
                cyan: "#2aa198",
                white: "#eee8d5",
                brightBlack: "#586e75",
                brightRed: "#cb4b16",
                brightGreen: "#586e75",
                brightYellow: "#657b83",
                brightBlue: "#839496",
                brightMagenta: "#6c71c4",
                brightCyan: "#93a1a1",
                brightWhite: "#fdf6e3"
            },
            "monokai": {
                background: "#272822",
                foreground: "#f8f8f2",
                cursor: "#f8f8f0",
                cursorAccent: "#272822",
                selectionBackground: "rgba(73, 72, 62, 0.8)",
                black: "#272822",
                red: "#f92672",
                green: "#a6e22e",
                yellow: "#f4bf75",
                blue: "#66d9ef",
                magenta: "#ae81ff",
                cyan: "#a1efe4",
                white: "#f8f8f2",
                brightBlack: "#75715e",
                brightRed: "#f92672",
                brightGreen: "#a6e22e",
                brightYellow: "#f4bf75",
                brightBlue: "#66d9ef",
                brightMagenta: "#ae81ff",
                brightCyan: "#a1efe4",
                brightWhite: "#f9f8f5"
            }
        };

        const activeTheme = THEMES[ACTIVE_THEME_NAME] || THEMES["dark"];
        document.body.style.backgroundColor = activeTheme.background;

        // xterm.js インスタンスとアドオンの初期化
        const term = new Terminal({
            cursorBlink: true,
            fontSize: DEFAULT_FONT_SIZE,
            fontFamily: FONT_FAMILY,
            allowProposedApi: true,
            theme: activeTheme
        });

        const fitAddon = new FitAddon.FitAddon();
        const unicode11Addon = new Unicode11Addon.Unicode11Addon();
        term.loadAddon(fitAddon);
        term.loadAddon(unicode11Addon);
        term.unicode.activeVersion = UNICODE_VERSION;

        term.open(document.getElementById("terminal"));
        fitAddon.fit();

        // WebSocket 通信の初期化
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const basePath = window.location.pathname.replace(/\/$/, "");
        const ws = new WebSocket(`${protocol}//${window.location.host}${basePath}/ws`);

        const sendResize = () => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
            }
        };

        ws.onopen = () => {
            sendResize();
            term.focus();
        };

        ws.onmessage = (event) => term.write(event.data);

        ws.onclose = () => term.write(EXIT_MESSAGE);

        term.onData((data) => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "input", data: data }));
            }
        });

        window.addEventListener("resize", () => {
            fitAddon.fit();
            sendResize();
        });
    </script>
</body>
</html>
