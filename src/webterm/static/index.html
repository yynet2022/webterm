<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Web Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            overflow: hidden;
        }
        #terminal {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-unicode11@0.8.0/lib/addon-unicode11.min.js"></script>
    <script>
        // ターミナルの表示設定定数
        const DEFAULT_FONT_SIZE = 14;
        const BACKGROUND_COLOR = "#1e1e1e";
        const FONT_FAMILY = "\"UDEV Gothic\", \"BIZ UDGothic\", \"Noto Sans Mono CJK JP\", monospace";
        const UNICODE_VERSION = "11";
        const EXIT_MESSAGE = "\r\n\x1b[33m[Process exited / Connection closed]\x1b[0m\r\n";

        // xterm.js インスタンスとアドオンの初期化
        const term = new Terminal({
            cursorBlink: true,
            fontSize: DEFAULT_FONT_SIZE,
            fontFamily: FONT_FAMILY,
            allowProposedApi: true,
            theme: { background: BACKGROUND_COLOR }
        });

        const fitAddon = new FitAddon.FitAddon();
        const unicode11Addon = new Unicode11Addon.Unicode11Addon();
        term.loadAddon(fitAddon);
        term.loadAddon(unicode11Addon);
        term.unicode.activeVersion = UNICODE_VERSION;

        term.open(document.getElementById("terminal"));
        fitAddon.fit();

        // WebSocket 通信の初期化
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        const sendResize = () => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
            }
        };

        ws.onopen = () => {
            sendResize();
            term.focus();
        };

        ws.onmessage = (event) => term.write(event.data);

        ws.onclose = () => term.write(EXIT_MESSAGE);

        term.onData((data) => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "input", data: data }));
            }
        });

        window.addEventListener("resize", () => {
            fitAddon.fit();
            sendResize();
        });
    </script>
</body>
</html>
